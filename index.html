<!DOCTYPE html>
<html lang="en">
<base href="./">"
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Your Premium Website Title" />
    <meta property="og:description" content="A high-quality website built with premium standards." />
    <meta property="og:image" content="https://example.com/images/og-image.png" />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Premium Website Title" />
    <meta name="twitter:description" content="A high-quality website built with premium standards." />
    <meta name="twitter:image" content="https://example.com/images/twitter-image.png" />

    <title>Premium Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/sidebar.css">
    <link rel="stylesheet" href="src/styles/profileCard.css">
    <link rel="stylesheet" href="src/styles/buttons.css">
    <link rel="stylesheet" href="src/styles/animations.css">
    <link rel="stylesheet" href="src/styles/overlays.css">
    <link rel="stylesheet" href="src/styles/analytics.css">
    <style>
        /* Simple debug styles */
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: lime;
            padding: 10px;
            font-family: monospace;
            z-index: 9999;
            max-width: 400px;
            max-height: 200px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <!-- Particles background -->
    <div id="particles-js"></div>
    
    <!-- Menu toggle button -->
    <div class="sidebar-toggle">
        <img src="assets/svgs/menu/Icon.svg" alt="Menu">
    </div>
    
    <!-- Sliding sidebar menu -->
    <div class="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-item" id="analytics">Analytics</div>
            <div class="sidebar-item" id="business">Business Inquiries</div>
            <div class="sidebar-item" id="donate">Donate</div>
            <div class="sidebar-item" id="overlays">Overlays</div>
            <div class="sidebar-item" id="statistics">Statistics</div>
            <div class="sidebar-item" id="support">Support Me</div>
        </div>
        
        <!-- Analytics panel container -->
        <div id="analytics-panel" class="sidebar-panel">
            <h3>Analytics</h3>
            <div id="analytics-chart"></div>
        </div>
        
        <!-- Overlays panel container -->
        <div id="overlays-panel" class="sidebar-panel">
            <h3>Overlay Effects</h3>
            <div id="overlay-selector"></div>
        </div>
    </div>
    
    <!-- Main profile card -->
    <div class="profile-card">
        <div class="profile-picture"></div>
        <h1 class="profile-name">Keirara(K3irara)</h1>
        <h2 class="profile-title">Creative Developer</h2>
        <h2 class="profile-subtitle">Digital Alchemist | Maomao Enthusiast</h2>
        
        <div class="search-container">
            <input type="text" id="search-box" placeholder="Type something magical... I DARE YOU!">
        </div>
        
        <div class="social-grid">
            <!-- Social buttons will be inserted here via JS -->
        </div>
    </div>
    
    <!-- Foreground overlay canvas for animated effects -->
    <canvas id="magic-canvas" class="foreground-overlay"></canvas>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- <script src="/src/main.ts" type="module"></script> -->
    
    <script src="src/main.ts" type="module"></script>
    <!-- <script src="/dist/main.js" type="module"></script> -->
</body>
</html>
