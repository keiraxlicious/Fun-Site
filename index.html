<!DOCTYPE html>
<html lang="en">
<base href="./">"
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> -->
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <meta property="og:title" content="Your Premium Website Title" />
    <meta property="og:description" content="A high-quality website built with premium standards." />
    <meta property="og:image" content="https://example.com/images/og-image.png" />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Premium Website Title" />
    <meta name="twitter:description" content="A high-quality website built with premium standards." />
    <meta name="twitter:image" content="https://example.com/images/twitter-image.png" />

    <title>Premium Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="src/styles/main.css">
    <style>
        /* Simple debug styles */
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: lime;
            padding: 10px;
            font-family: monospace;
            z-index: 9999;
            max-width: 400px;
            max-height: 200px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <!-- Particles background -->
    <div id="particles-js"></div>
    
    
    <!-- Sliding sidebar menu -->
    <div class="sidebar">
        <div class="sidebar-content">
            <div class="sidebar-item" id="analytics">Analytics</div>
            <div class="sidebar-item" id="business">Business Inquiries</div>
            <div class="sidebar-item" id="donate">Donate</div>
            <div class="sidebar-item" id="overlays">Overlays</div>
            <div class="sidebar-item" id="statistics">Statistics</div>
            <div class="sidebar-item" id="support">Support Me</div>
        </div>
        
        <!-- Analytics panel container -->
        <div id="analytics-panel" class="sidebar-panel">
            <h3>Analytics</h3>
            <div id="analytics-chart"></div>
        </div>
        
        <!-- Enhanced structure for overlay panel -->
        <div id="overlays-panel" class="sidebar-panel">
            <div class="panel-header">
            <h3 class="panel-title">Overlay Effects</h3>
            </div>
            
            <div class="panel-section">
            <h4 class="section-title">Categories</h4>
            <div class="category-selector">
                <div class="category-option active" data-category="all">All</div>
                <div class="category-option" data-category="particles">Particles</div>
                <div class="category-option" data-category="light">Light</div>
                <div class="category-option" data-category="ambient">Ambient</div>
            </div>
            </div>
            
            <div class="panel-section">
            <h4 class="section-title">Effects</h4>
            <div id="overlay-selector" class="overlay-options-container">
                <!-- Overlay options will be populated here -->
            </div>
            </div>
            
            <div class="panel-section">
            <h4 class="section-title">Render Mode</h4>
            <div class="render-mode-options">
                <!-- Render mode options here -->
            </div>
            </div>
        </div>
    </div>
    <!-- Main profile card -->
    <div class="profile-card-structure profile-card-theme">
        
        <!-- Menu toggle button -->
        <div class="sidebar-toggle-structure sidebar-toggle-theme">
            <img id="icon" src="assets/svgs/menu/Icon.svg" alt="Menu">
        </div>
        <div class="profile-picture-structure profile-picture-theme"></div>
        <h1 class="profile-name-structure profile-name-theme">Keirara(K3irara)</h1>
        <h2 class="profile-title-structure profile-title-theme">Creative Developer</h2>
        <h2 class="profile-subtitle-structure profile-subtitle-theme">Digital Alchemist | Maomao Enthusiast</h2>
        
        <div class="search-container-structure search-container-theme">
            <input type="text" id="search-box" placeholder="Type something magical... I DARE YOU!">
        </div>
        
        <div class="social-grid-structure social-grid-theme">
            <!-- Social buttons will be inserted here via JS -->
        </div>
    </div>
    
    <!-- Foreground overlay canvas for animated effects -->
    <canvas id="magic-canvas" class="foreground-overlay"></canvas>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- <script src="/src/main.ts" type="module"></script> -->
    
    <script src="src/main.ts" type="module"></script>

    <script>
        document.addEventListener("wheel", (event) => {
            if (event.ctrlKey) {
                event.preventDefault(); // Prevent zooming with Ctrl + scroll
            }
        });

        document.addEventListener("keydown", (event) => {
            if ((event.ctrlKey || event.metaKey) && (event.key === "+" || event.key === "-")) {
                event.preventDefault(); // Prevent zooming with Ctrl/Command + +/- keys
            }
        });
    </script>
    <!-- <script src="/dist/main.js" type="module"></script> -->
</body>
</html>
